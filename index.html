
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>

    <header>
        <h1>Game Finder</h1>
        <p>Find your favorite games!</p>
    </header>

    <main>
        <section>
            <h2>Search Games</h2>

            <form id="search-form">
                <label for="search">Search games</label>
                <input id="search" type="search" placeholder="Enter a game title">
                <button type="submit">Search</button>
                <button type="button" id="random-button">Random Game</button>
            </form>
        </section>

        <section>
            <h2>Game List</h2>
            <div id="game-list" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Game Finder | Powered by FreeToGame API</p>
    </footer>

</body>
</html>
